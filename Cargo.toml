[workspace]
members = ["crates/eml-message", "crates/eml-core", "crates/eml-protocol", "crates/eml-cli", "crates/eml-app", "crates/eml-worker", "crates/eml-gui", "crates/eml-macos", "crates/eml-windows", "xtask"]
exclude = ["fuzz", "vendor/winit", "vendor/i-slint-core", "vendor/parley"]
resolver = "3"

[workspace.package]
version = "6.0.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
memchr = "2.8.3"
encoding_rs = "0.8.42"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"

[profile.release]
overflow-checks = true

[profile.mutants]
inherits = "test"
debug = false

[patch.crates-io]
winit = { path = "vendor/winit" }
i-slint-core = { path = "vendor/i-slint-core" }
parley = { path = "vendor/parley" }
