[workspace]
members = ["crates/eml-message", "crates/eml-core", "crates/eml-protocol", "crates/eml-cli", "crates/eml-app", "crates/eml-gui", "crates/spin-on", "xtask"]
exclude = ["fuzz", "crates/slint-qt", "crates/slint-build-source"]
resolver = "3"

[workspace.package]
version = "7.0.0"
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
memchr = "2.8.3"
encoding_rs = "0.8.44"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
too_many_lines = "warn"
cognitive_complexity = "warn"

[profile.release]
overflow-checks = true

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

[profile.mutants]
inherits = "test"
debug = false

[patch.crates-io]
# Slint 1.18.1 executor without archived pin-utils.
spin_on = { path = "crates/spin-on" }

# Native paths, accessibility and required Qt backend: see its SOURCE-PATCH.md.
i-slint-backend-qt = { path = "crates/slint-qt" }

# Explicit configuration for the published Linux widget source provider.
slint-build = { path = "crates/slint-build-source" }
