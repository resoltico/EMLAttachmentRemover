# cargo-about policy: licenses accepted for shipped binaries.
accepted = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "MPL-2.0", "LicenseRef-Slint-Royalty-free-2.0",
  "BSL-1.0", "CC0-1.0", "Apache-2.0 WITH LLVM-exception",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Microsoft uses lowercase license filenames; select the actual attribution text.
[windows-link.clarify]
license = "MIT"
[[windows-link.clarify.files]]
path = "license-mit"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

