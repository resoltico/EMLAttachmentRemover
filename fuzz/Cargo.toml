[package]
name = "eml-preparation-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MPL-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
eml-message = { path = "../crates/eml-message" }

[[bin]]
name = "preparation"
path = "fuzz_targets/preparation.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# Standalone fuzz workspace: authored-code policy matches the root workspace.
[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
allow_attributes = "deny"
too_many_lines = "warn"
cognitive_complexity = "warn"
