[package]
name = "eml-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eml-message = { path = "../eml-message" }
getrandom = "0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Security", "Win32_System_IO"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
