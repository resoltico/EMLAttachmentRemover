[package]
name = "eml-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["renderer-software"]
renderer-software = ["slint/renderer-software"]
renderer-skia = ["slint/renderer-skia"]
desktop = ["slint/backend-winit", "slint/raw-window-handle-06", "slint/unstable-winit-030", "dep:rfd", "dep:opener", "dep:objc2", "dep:objc2-app-kit"]

[dependencies]
eml-app = { path = "../eml-app" }
eml-core = { path = "../eml-core" }
eml-protocol = { path = "../eml-protocol" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "accessibility"] }
# Embedded AboutSlint SVG and widget icons also need decoding without winit.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders", "svg"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
dirs = "6.0.0"
rfd = { version = "0.17.2", optional = true }
opener = { version = "0.8.5", features = ["reveal"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication"] }

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[[bin]]
name = "emlattachmentremover-gui"
path = "src/main.rs"
required-features = ["desktop"]

[lints]
workspace = true
