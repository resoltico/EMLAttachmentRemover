[package]
name = "eml-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["renderer-software"]
renderer-software = ["slint/renderer-software"]
renderer-skia = ["slint/renderer-skia"]
native = ["dep:opener", "dep:arboard"]
desktop-winit = ["native", "slint/backend-winit", "slint/raw-window-handle-06", "slint/unstable-winit-030", "dep:rfd", "dep:objc2", "dep:objc2-app-kit"]
desktop-qt = ["native", "slint/backend-qt", "slint/raw-window-handle-06", "dep:i-slint-backend-qt", "dep:zbus", "dep:url", "dep:ashpd", "dep:raw-window-handle"]

[dependencies]
eml-app = { path = "../eml-app" }
eml-core = { path = "../eml-core" }
eml-protocol = { path = "../eml-protocol" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "accessibility"] }
# Embedded AboutSlint SVG and widget icons also need decoding without winit.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders", "svg"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
dirs = "7.0.0"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
arboard = { version = "=3.7.0", default-features = false, optional = true }
opener = { version = "0.9.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
i-slint-backend-qt = { version = "=1.18.1", features = ["raw-window-handle-06"], optional = true }
ashpd = { version = "=0.14.0", default-features = false, features = ["async-io", "raw_handle", "wayland", "file_chooser"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "proxy"], optional = true }
url = { version = "2.5.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17.2", optional = true }
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }

[build-dependencies]
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
vtable = "=0.5.0"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
i-slint-compiler = { version = "=1.18.1", default-features = false }
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

[[bin]]
name = "emlattachmentremover-gui"
path = "src/main.rs"
required-features = ["native"]

[lints]
workspace = true

# Cargo builds this stable test executable before spawning parallel tests.
[[bin]]
name = "eml-gui-cli-fixture"
path = "../eml-app/tests/support/cli_fixture.rs"
test = false
