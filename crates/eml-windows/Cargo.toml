[package]
name = "eml-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
native-fixtures = ["windows-sys/Win32_System_Pipes"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Globalization", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "job-observation"
path = "tests/support/job_observation.rs"
required-features = ["native-fixtures"]

[lints]
workspace = true
