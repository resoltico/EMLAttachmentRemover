name: Observe CI source refs
description: Read bounded live PR or queue ref metadata; Rust makes identity decisions.
outputs:
  file:
    description: Owned JSON observation path
    value: ${{ steps.observe.outputs.file }}
runs:
  using: composite
  steps:
    - id: observe
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CI_READ_TOKEN: ${{ github.token }}
      with:
        script: |
          const fs = require('node:fs');
          const get = async (suffix) => {
            const response = await fetch('https://api.github.com/repos/' +
              encodeURIComponent(context.repo.owner) + '/' +
              encodeURIComponent(context.repo.repo) + suffix, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(10000),
              headers: {Authorization: 'Bearer ' + process.env.CI_READ_TOKEN,
                Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'EML-Attachment-Remover-CI'}
            });
            if (!response.ok || !response.body) throw new Error('CI ref GET failed: ' + response.status);
            const reader = response.body.getReader();
            const chunks = []; let size = 0;
            for (;;) {
              const part = await reader.read();
              if (part.done) break;
              size += part.value.byteLength;
              if (size > 1048576) {await reader.cancel(); throw new Error('CI ref response exceeds bound');}
              chunks.push(Buffer.from(part.value));
            }
            return JSON.parse(Buffer.concat(chunks, size).toString('utf8'));
          };
          const ref = async (name) => get('/git/ref/' + name.split('/').map(encodeURIComponent).join('/'));
          let observation = {};
          if (context.eventName === 'pull_request') {
            const pull = await get('/pulls/' + context.payload.number);
            const base = await ref('heads/main');
            const merge = await ref('pull/' + context.payload.number + '/merge');
            observation = {number: pull.number, head: pull.head.sha, base: pull.base.sha, base_ref: pull.base.ref,
              base_tip: base.object.sha, merge_ref: merge.object.sha};
          } else if (context.eventName === 'merge_group') {
            const name = context.payload.merge_group.head_ref;
            const current = await ref(name.replace(/^refs\//, ''));
            observation = {queue_ref: name, source_ref: current.object.sha};
          } else if (context.eventName !== 'push') {
            throw new Error('Unsupported CI metadata event');
          }
          fs.mkdirSync('target/ci', {recursive: true});
          const file = require('node:path').resolve('target/ci/live.json');
          fs.writeFileSync(file, JSON.stringify(observation) + '\n', {mode: 0o600});
          core.setOutput('file', file);
