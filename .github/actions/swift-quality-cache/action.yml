name: Cache installed Swift quality tools
description: Reuse isolated native quality binaries before the installer validates their versions
runs:
  using: composite
  steps:
    - id: platform
      shell: bash
      run: |
        system_version=$(sw_vers -productVersion)
        system_build=$(sw_vers -buildVersion)
        architecture=$(uname -m)
        sdk_version=$(xcrun --show-sdk-version)
        sdk_build=$(xcrun --show-sdk-build-version)
        printf 'identity=%s-%s-%s-%s-%s\n' "$system_version" "$system_build" "$architecture" "$sdk_version" "$sdk_build" >> "$GITHUB_OUTPUT"
        printf 'EML_SWIFT_TOOLS=%s\n' "$RUNNER_TEMP/eml-swift-quality-tools" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/eml-swift-quality-tools
        key: eml-swift-quality-${{ runner.os }}-${{ steps.platform.outputs.identity }}-${{ hashFiles('integrations/macos-ui/toolchain.toml', 'integrations/macos-ui/install-quality-tools.sh', 'integrations/macos-ui/install-swift-toolchain.sh', 'integrations/macos-ui/swiftc.sh', 'tools/pinned_download.py', '.github/actions/swift-quality-cache/action.yml') }}
