name: Minimum supported macOS 15 compatibility
description: Fail closed unless the runner is macOS 15 on the intended CPU
inputs:
  architecture:
    description: Expected native CPU for this minimum-OS job
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXPECTED_ARCH: ${{ inputs.architecture }}
      run: |
        set -euo pipefail
        case "$EXPECTED_ARCH" in
          arm64|x86_64) ;;
          *) printf 'Unsupported minimum-OS CPU requirement: %s\n' "$EXPECTED_ARCH" >&2; exit 1 ;;
        esac
        version=$(/usr/bin/sw_vers -productVersion)
        cpu=$(/usr/bin/uname -m)
        if [[ $version != 15.* || $cpu != "$EXPECTED_ARCH" ]]; then
          printf 'Minimum-OS gate requires macOS 15 / %s, found %s / %s\n' "$EXPECTED_ARCH" "$version" "$cpu" >&2
          exit 1
        fi
        if [[ $cpu == arm64 ]] && ! /usr/bin/arch -x86_64 /usr/bin/true; then
          printf 'Minimum-OS Apple Silicon gate requires working Rosetta\n' >&2
          exit 1
        fi
