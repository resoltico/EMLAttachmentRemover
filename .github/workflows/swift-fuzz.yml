name: Native receipt fuzzing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign duration
        type: choice
        options: [standard, extended]
        default: standard
  workflow_call:
    inputs:
      campaign:
        description: Campaign duration
        type: string
        default: standard

permissions:
  contents: read

concurrency:
  group: swift-fuzz-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  receipt-fuzz:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - name: Select and verify the pinned delivery SDK
        run: uv run /bin/sh integrations/macos-ui/ci-sdk.sh >> "$GITHUB_ENV"
      - name: Install the pinned official Swift toolchain
        run: uv run /bin/sh integrations/macos-ui/install-swift-toolchain.sh
      - name: Replay regressions and fuzz the native receipt model with ASan
        if: ${{ inputs.campaign != 'extended' }}
        env:
          FUZZ_OUTPUT: ${{ runner.temp }}/native-fuzz
        run: uv run /bin/sh integrations/macos-ui/fuzz.sh "$FUZZ_OUTPUT" -max_total_time=300
      - name: Run the extended campaign with ASan
        if: ${{ inputs.campaign == 'extended' }}
        env:
          FUZZ_OUTPUT: ${{ runner.temp }}/native-fuzz
        run: uv run /bin/sh integrations/macos-ui/fuzz.sh "$FUZZ_OUTPUT" -runs=-1 -max_total_time=1800
      - name: Preserve corpus, invocation and failure inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-fuzz/corpus
            ${{ runner.temp }}/native-fuzz/*.log
            ${{ runner.temp }}/native-fuzz/sources
            ${{ runner.temp }}/native-fuzz/seeds
            ${{ runner.temp }}/native-fuzz/invocation.json
            ${{ runner.temp }}/native-fuzz/crash-*
            ${{ runner.temp }}/native-fuzz/timeout-*
            ${{ runner.temp }}/native-fuzz/oom-*
            ${{ runner.temp }}/native-fuzz/leak-*
          if-no-files-found: warn
          retention-days: 30
