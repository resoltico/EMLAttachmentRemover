name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDEVMODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONWARNINGS: error
    strategy:
      fail-fast: false
      matrix:
        include:
          # Shared static checks include mypy targets linux, darwin, and win32.
          - os: ubuntu-latest
            python: 3.14.8
            static: true
          - os: macos-latest
            python: 3.14.8
          - os: windows-latest
            python: 3.14.8
          - os: ubuntu-latest
            python: 3.14.8t
          - os: macos-latest
            python: 3.14.8t
          - os: windows-latest
            python: 3.14.8t
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: ${{ matrix.python }}
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
        env:
          PYTHONWARNINGS: default
      - name: Require the POSIX integration environment
        if: runner.os != 'Windows'
        shell: bash
        run: test -x /bin/sh
      - name: Install pinned Swift quality tools
        if: runner.os == 'macOS'
        run: uv run /bin/sh integrations/macos-ui/install-quality-tools.sh
      - name: Run the complete quality gate
        if: matrix.static
        run: uv run python tools/tasks.py quality
      - name: Run the platform-native quality gate
        if: ${{ !matrix.static }}
        run: uv run python tools/tasks.py quality --native
      - name: Preserve machine-readable quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results-project-ci.xml
            build/coverage.xml
            ${{ runner.temp }}/native-fuzz-tests
          if-no-files-found: warn
          retention-days: 30
