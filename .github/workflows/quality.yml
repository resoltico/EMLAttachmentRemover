name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDEVMODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONWARNINGS: error
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: 3.14.7
          - os: macos-latest
            python: 3.14.7
          - os: windows-latest
            python: 3.14.7
          - os: ubuntu-latest
            python: 3.14.7t
          - os: macos-latest
            python: 3.14.7t
          - os: windows-latest
            python: 3.14.7t
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and CPython
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.5
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Require the POSIX integration environment
        if: runner.os != 'Windows'
        shell: bash
        run: test -x /bin/sh
      - name: Run the complete quality gate
        run: uv run python tools/tasks.py quality
      - name: Preserve machine-readable quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}
          path: |
            build/test-results-project-ci.xml
            build/coverage.xml
          if-no-files-found: warn
          retention-days: 30
