name: Extended verification
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extended:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: policy
        name: Derive tools from the checked source
        run: |
          mkdir -p target
          cargo xtask distribution > target/extended-distribution.json
          git show -s --format='Source: %H; parents: %P' > target/extended-source.txt
          for key in cargo_deny cargo_fuzz fuzz_compiler; do
            printf '%s=%s\n' "$key" "$(jq -er --arg key "$key" '.tools[$key]' target/extended-distribution.json)" >> "$GITHUB_OUTPUT"
          done
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-deny@${{ steps.policy.outputs.cargo_deny }},cargo-fuzz@${{ steps.policy.outputs.cargo_fuzz }}
          checksum: true
          fallback: none
      - name: Install separate pinned fuzz compiler
        env:
          FUZZ_COMPILER: ${{ steps.policy.outputs.fuzz_compiler }}
        run: rustup toolchain install "$FUZZ_COMPILER" --profile minimal
      - name: Fresh advisory and source policy across supported graphs
        run: |
          cargo deny --locked --config xtask/dependencies.toml check advisories sources licenses
          cargo deny --locked --manifest-path fuzz/Cargo.toml --config xtask/dependencies.toml check advisories sources licenses
          cargo deny --locked --manifest-path tests/native-filesystem/Cargo.toml --config xtask/dependencies.toml check advisories sources licenses
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo deny --locked --target "$target" --features eml-gui/macos-gui --config xtask/dependencies.toml check advisories sources licenses
          done
      - name: Extended independent semantic properties
        if: ${{ !cancelled() && steps.policy.outcome == 'success' }}
        env:
          PROPTEST_CASES: '4096'
        run: cargo test --locked -p eml-core --test model
      - name: Bounded synthetic-input fuzz campaign
        if: ${{ !cancelled() && steps.policy.outcome == 'success' }}
        run: cargo xtask fuzz --seconds 900
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: extended-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            target/extended-*
            target/proptest/**
            target/fuzz/*/result.json
            target/fuzz/*/metadata-before.json
            target/fuzz/*/metadata-after.json
            target/fuzz/*/*.control.json
            target/fuzz/*/*.log
            target/fuzz/*/*.txt
            target/fuzz/*/artifacts/**
          if-no-files-found: error
