name: Extended verification
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: extended-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutations:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: policy
        name: Read the pinned mutation tool from the source plan
        run: |
          mkdir -p target
          cargo xtask distribution --github-output "$GITHUB_OUTPUT" > target/mutation-distribution.json
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-mutants@${{ steps.policy.outputs.cargo_mutants }}
          checksum: true
          fallback: none
      - name: Execute the complete initial selection of both authorization guards
        run: cargo xtask mutants --initial
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: mutations-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            target/mutation-distribution.json
            target/mutations/*/result.json
            target/mutations/*/discovery.json
            target/mutations/*/campaign.log
            target/mutations/*/*.control.json
            target/mutations/*/output/mutants.out/**
          if-no-files-found: error
  extended:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: policy
        name: Derive tools from the checked source
        run: |
          mkdir -p target
          cargo xtask distribution --github-output "$GITHUB_OUTPUT" > target/extended-distribution.json
          git show -s --format='Source: %H; parents: %P' > target/extended-source.txt
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-deny@${{ steps.policy.outputs.cargo_deny }}
          checksum: true
          fallback: none
      - name: Install exact upstream prebuilt cargo-fuzz
        env:
          VERSION: ${{ steps.policy.outputs.cargo_fuzz }}
        run: |
          archive="$RUNNER_TEMP/cargo-fuzz.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --max-time 60 --max-filesize 20000000 "https://github.com/rust-fuzz/cargo-fuzz/releases/download/$VERSION/cargo-fuzz-$VERSION-x86_64-unknown-linux-musl.tar.gz" -o "$archive"
          printf 'b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c  %s\n' "$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cargo-fuzz-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-fuzz-bin" cargo-fuzz
          test "$("$RUNNER_TEMP/cargo-fuzz-bin/cargo-fuzz" fuzz --version)" = "cargo-fuzz $VERSION"
          printf '%s\n' "$RUNNER_TEMP/cargo-fuzz-bin" >> "$GITHUB_PATH"
      - name: Install separate pinned fuzz compiler
        env:
          FUZZ_COMPILER: ${{ steps.policy.outputs.fuzz_compiler }}
        run: rustup toolchain install "$FUZZ_COMPILER" --profile minimal
      - name: Fresh advisory and source policy across supported graphs
        run: cargo xtask check-dependencies --out target/dependency-checks
      - name: Independently maintain host incident policy validity
        if: ${{ !cancelled() && steps.policy.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask check-host-incidents --out target/host-incident-checks
      - name: Extended independent semantic properties
        if: ${{ !cancelled() && steps.policy.outcome == 'success' }}
        env:
          PROPTEST_CASES: '4096'
        run: cargo test --locked -p eml-core --test model
      - name: Bounded synthetic-input fuzz campaign
        if: ${{ !cancelled() && steps.policy.outcome == 'success' }}
        run: cargo xtask fuzz --seconds 900
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: extended-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            target/extended-*
            target/dependency-checks/**
            target/host-incident-checks/**
            target/proptest/**
            target/fuzz/*/result.json
            target/fuzz/*/metadata-before.json
            target/fuzz/*/metadata-after.json
            target/fuzz/*/*.control.json
            target/fuzz/*/*.log
            target/fuzz/*/*.txt
            target/fuzz/*/artifacts/**
          if-no-files-found: error
