name: macOS delivery compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  producer:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          python-version: 3.14.7
          enable-cache: false
      - run: uv sync --locked --group dev --python 3.14.7
        env:
          PYTHONWARNINGS: default
      - run: uv run /bin/sh integrations/macos-ui/install-swift-toolchain.sh
      - run: uv run python -B -m tools.release_delivery --output-directory release-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-delivery
          path: release-dist/*
          if-no-files-found: error
  consumers:
    needs: producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.21
          python-version: 3.14.7
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --python 3.14.7
        env:
          PYTHONWARNINGS: default
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compatibility-delivery
          path: release-dist
      - run: uv run --no-project --python 3.14.7 python -B -m tools.release_delivery --verify-directory release-dist
      - name: Select Apple SDK and platform tools on minimum OS
        if: matrix.os == 'macos-14'
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
      - run: uv run /bin/sh integrations/macos-ui/install-quality-tools.sh
      - run: uv run python tools/tasks.py quality --native
        env:
          EML_DELIVERY_DIRECTORY: release-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-evidence-${{ matrix.os }}
          path: |
            build/coverage.xml
            build/test-results-project-ci.xml
