name: macOS delivery compatibility
on:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed
concurrency:
  group: macos-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  producer:
    runs-on: macos-26
    outputs:
      delivery_artifact_id: ${{ steps.delivery_upload.outputs.artifact-id }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: false
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - run: exec uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - name: Select and verify the pinned delivery SDK
        run: exec uv run /bin/sh integrations/macos-ui/ci-sdk.sh >> "$GITHUB_ENV"
      - run: exec uv run /bin/sh integrations/macos-ui/install-swift-toolchain.sh
      - run: exec uv run python -B -m tools.release_delivery --output-directory release-dist
        env:
          TZ: UTC
      - id: delivery_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 30
  consumers:
    needs: producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, xcode-27]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify minimum macOS 15 host and tools
        if: matrix.os == 'macos-15' || matrix.os == 'macos-15-intel'
        uses: ./.github/actions/sequoia-compatibility
        with:
          architecture: ${{ matrix.os == 'macos-15' && 'arm64' || 'x86_64' }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - run: exec uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.producer.outputs.delivery_artifact_id || '0' }}
          path: release-dist
      - run: exec uv run --no-project --python 3.14.8 python -B -m tools.release_delivery --verify-directory release-dist
      - name: Restore pinned Swift quality tool cache
        uses: ./.github/actions/swift-quality-cache
      - run: exec uv run /bin/sh integrations/macos-ui/install-quality-tools.sh
      - run: exec uv run python tools/tasks.py quality --native
        env:
          EML_DELIVERY_DIRECTORY: release-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/coverage.xml
            ${{ runner.temp }}/native-fuzz-tests
            build/test-results-project-ci.xml
          retention-days: 30
