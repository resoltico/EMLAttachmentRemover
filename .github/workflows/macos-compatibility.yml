name: macOS delivery compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  producer:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: false
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - run: uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - name: Select and verify the pinned delivery SDK
        run: uv run /bin/sh integrations/macos-ui/ci-sdk.sh >> "$GITHUB_ENV"
      - run: uv run /bin/sh integrations/macos-ui/install-swift-toolchain.sh
      - run: uv run python -B -m tools.release_delivery --output-directory release-dist
        env:
          TZ: UTC
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-dist/*
          if-no-files-found: error
  consumers:
    needs: producer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, xcode-27]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - run: uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compatibility-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-dist
      - run: uv run --no-project --python 3.14.8 python -B -m tools.release_delivery --verify-directory release-dist
      - name: Select Apple SDK and platform tools on minimum OS
        if: matrix.os == 'macos-14'
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
      - run: uv run /bin/sh integrations/macos-ui/install-quality-tools.sh
      - run: uv run python tools/tasks.py quality --native
        env:
          EML_DELIVERY_DIRECTORY: release-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/coverage.xml
            ${{ runner.temp }}/native-fuzz-tests
            build/test-results-project-ci.xml
