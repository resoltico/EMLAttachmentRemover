# Merge gate: deterministic, runnable locally (except Windows), target <= 20 min.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read tool versions
        id: tools
        shell: bash
        run: |
          for key in cargo_deny cargo_about cargo_fuzz fuzz_compiler actionlint shellcheck; do
            value=$(awk -F '"' -v key="$key" '$1 ~ "^" key " = " {print $2}' xtask/tools.toml)
            test -n "$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-deny@${{ steps.tools.outputs.cargo_deny }},shellcheck@${{ steps.tools.outputs.shellcheck }}
      - name: Install pinned actionlint from its upstream release
        env:
          VERSION: ${{ steps.tools.outputs.actionlint }}
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/actionlint_${VERSION}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-lint-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all --check
      - run: cargo deny --locked check
      - run: actionlint
      - run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Verification budget
        run: scripts/check-budget.sh
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26 }
          - { runner: ubuntu-22.04 }
          - { runner: ubuntu-22.04-arm }
          # The desktop crates are Unix-only until a Windows GUI is designed.
          - { runner: windows-2022 }
          - { runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Native prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config; fi
      - name: Verify native MSVC tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = rustc -vV | Select-String '^host: ' | ForEach-Object { $_.Line.Substring(6) }
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          if ($target -ne $expected) { throw "Expected native Rust host $expected; found $target" }
          if ($target -notlike '*-pc-windows-msvc') { throw "Expected native MSVC host; found $target" }
          cargo run --locked -p xtask --target $target -- ci --rust-only
      - if: runner.os != 'Windows'
        run: cargo xtask ci --rust-only
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  app:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-app-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-app-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: |
          for key in cargo_deny cargo_about cargo_fuzz fuzz_compiler actionlint shellcheck; do
            value=$(awk -F '"' -v key="$key" '$1 ~ "^" key " = " {print $2}' xtask/tools.toml)
            test -n "$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo xtask dist --app --out target/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-${{ github.sha }}
          path: target/dist/*
          if-no-files-found: error
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  ci-ok:
    if: always()
    needs: [lint, test, app]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required job ended with: $result"; exit 1; }
          done
