# Merge gate: deterministic, runnable locally (except Windows), target <= 20 min.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  EML_SOURCE_REVISION: ${{ github.sha }}
jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: cargo-lint-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: cargo xtask tool-versions >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-deny@${{ steps.tools.outputs.cargo_deny }},shellcheck@${{ steps.tools.outputs.shellcheck }}
      - name: Install pinned actionlint from its upstream release
        env:
          VERSION: ${{ steps.tools.outputs.actionlint }}
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/actionlint_${VERSION}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Install pinned PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion '${{ steps.tools.outputs.psscriptanalyzer }}' -Scope CurrentUser -Force
      - run: cargo xtask lint
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26 }
          - { runner: ubuntu-26.04 }
          - { runner: ubuntu-26.04-arm }
          # The desktop crates are Unix-only until a Windows GUI is designed.
          - { runner: windows-2022 }
          - { runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Native prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libwayland-dev pkg-config; fi
      - name: Verify native MSVC tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = rustc -vV | Select-String '^host: ' | ForEach-Object { $_.Line.Substring(6) }
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          if ($target -ne $expected) { throw "Expected native Rust host $expected; found $target" }
          if ($target -notlike '*-pc-windows-msvc') { throw "Expected native MSVC host; found $target" }
          # Cargo test rebuilds xtask for its integration tests. Windows cannot
          # replace a running executable, so run an isolated copy of the artifact.
          $build = cargo build --locked -p xtask --bin xtask --target $target --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifact = @($build | ConvertFrom-Json | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'xtask' -and $_.executable
          } | Select-Object -ExpandProperty executable)
          if ($artifact.Count -ne 1) { throw "Expected one xtask executable; found $($artifact.Count)" }
          $driver = Join-Path $env:RUNNER_TEMP 'eml-xtask-ci.exe'
          Copy-Item -LiteralPath $artifact[0] -Destination $driver
          Write-Host "CI driver: $driver; Cargo artifact: $($artifact[0])"
          & $driver ci --rust-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: runner.os != 'Windows'
        run: cargo xtask ci --rust-only
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  app:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-app-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: |
            cargo-app-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            cargo-app-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: cargo xtask tool-versions >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo xtask dist --app --target ${{ matrix.target }} --out "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  install:
    name: CLI install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: cargo-install-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        run: cargo run --locked -p xtask --target "$TARGET_TRIPLE" -- tool-versions >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - name: Shells for startup-file checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Build the native CLI release archive
        run: cargo run --locked -p xtask --target "$TARGET_TRIPLE" -- dist --cli --target "$TARGET_TRIPLE" --out "$RUNNER_TEMP/dist"
      - name: Prepare and test the Unix installation
        if: runner.os != 'Windows'
        run: |
          python3 install/prepare-test-release.py "$RUNNER_TEMP/dist"
          bash install/install_test.sh "$RUNNER_TEMP/dist"
      - name: Prepare and test the Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python install/prepare-test-release.py "$env:RUNNER_TEMP/dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install/install_test.ps1 -Dist "$env:RUNNER_TEMP/dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  ci-ok:
    if: always()
    needs: [lint, test, app, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [ -n "$RESULTS" ] || { echo "No required job results were supplied"; exit 1; }
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required job ended with: $result"; exit 1; }
          done
