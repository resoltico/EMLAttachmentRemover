name: Pinned macOS icon observations
on:
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: icon-observation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        run: |
          plan=$(cargo xtask distribution)
          matrix=$(jq -ce '{include: [.native_targets[] | select(.os == "macos") | {platform,target,runner}]} | select(.include | length == 2)' <<< "$plan")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  observe:
    name: Icon observations / ${{ matrix.platform }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and native image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          rustc -vV
          uname -a
          sw_vers
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
      - name: Two finite pinned icon observations; no app qualification
        run: cargo xtask macos-icon-diagnostic --out target/icon-diagnostic
      - name: Retain every observed result and failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-observations-${{ github.sha }}-${{ matrix.platform }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            target/icon-diagnostic/**/*.log
            target/icon-diagnostic/**/*.stderr
            target/icon-diagnostic/**/*.json
            target/icon-diagnostic/**/icon-partial.plist
            target/process-control/**/output.*
          if-no-files-found: error
