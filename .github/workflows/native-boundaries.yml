name: Native library boundary checks
on:
  push:
    branches: [codex/v6-rust-swiftui]
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive Unix filesystem evidence matrix
        id: targets
        run: |
          plan=$(cargo xtask distribution)
          matrix=$(jq -ce '{include: [.native_targets[] | select(.os != "windows") | {platform,target,runner}]} | select(.include | length == 4)' <<< "$plan")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  probes:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record actual compiler and machine
        run: |
          rustc -vV
          uname -a
      - name: Real owned process lifetime and signal probes
        run: |
          cargo test --locked --package xtask --bin xtask
          cargo test --locked --package xtask --lib
          cargo test --locked --package xtask --test processes
      - name: Regenerate and check six target notice material trees
        run: |
          plan=$(cargo xtask distribution)
          about=$(jq -er '.tools.cargo_about' <<< "$plan")
          cargo install cargo-about --version "$about" --locked
          cargo xtask notices --check
  filesystem:
    name: Filesystem / ${{ matrix.platform }}
    needs: distribution
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.distribution.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record actual compiler and machine
        run: |
          rustc -vV
          uname -a
      - name: Native distribution planner
        run: cargo xtask distribution
      - name: Held filesystem and namespace admission tests
        run: |
          cargo clippy --locked --package eml-fs --all-targets -- -D warnings
          cargo test --locked --package eml-fs -- --nocapture
      - name: Native core request resource admission
        run: |
          cargo clippy --locked --package eml-core --all-targets -- -D warnings
          cargo test --locked --package eml-core --test request
      - name: Native core diagnostic vocabulary
        run: cargo test --locked --package eml-core --test diagnostic
      - name: Native collection, destination planning and held-source preparation
        run: cargo test --locked --package eml-core --lib --test collection --test destination --test dry_run --test execution --test existing --test source
      - name: Native protocol path transport
        run: |
          cargo clippy --locked --package remove-eml-attachments --all-targets -- -D warnings
          cargo test --locked --package remove-eml-attachments --lib --bin remove-eml-attachments --test cli_process --test events --test request --test path
      - name: Native Swift protocol and queue model
        if: ${{ runner.os == 'macOS' }}
        run: |
          plan=$(cargo xtask distribution)
          version=$(jq -er '.xcode.version' <<< "$plan")
          build=$(jq -er '.xcode.build' <<< "$plan")
          export DEVELOPER_DIR="/Applications/Xcode_${version}.app/Contents/Developer"
          test "$(xcodebuild -version)" = "$(printf 'Xcode %s\nBuild version %s' "$version" "$build")"
          xcrun swift --version
          xcrun swift format lint --strict --recursive macos-app
          set -o pipefail
          xcrun swift test --package-path macos-app --scratch-path target/swift-model -Xswiftc -warnings-as-errors 2>&1 | tee target/swift-model-tests.log
          test "$(grep -Ec 'Test run with [1-9][0-9]* tests.*passed' target/swift-model-tests.log)" -eq 1
          if grep -Eq 'Test .+ (failed|skipped)( after| due|$)|recorded an issue' target/swift-model-tests.log; then exit 1; fi
      - name: Real different-UID namespace controls on owned fixtures
        run: |
          cargo build --locked --package eml-fs --example namespace-credentials
          victim_uid=$(id -u)
          victim_gid=$(id -g)
          sudo -n "$PWD/target/debug/examples/namespace-credentials" "$victim_uid" "$victim_gid"
      - name: Actual native helper process, pipe and ownership integration
        if: ${{ runner.os == 'macOS' }}
        run: cargo xtask macos-process-tests
      - name: Assemble and inspect actual signed native SwiftUI app
        if: ${{ runner.os == 'macOS' }}
        run: cargo xtask build-macos-app --out target/native-app-build
      - name: Actual owned GUI Open With and fresh preference observations
        if: ${{ runner.os == 'macOS' }}
        run: cargo xtask macos-gui-tests --app 'target/native-app-build/EML Attachment Remover.app' --out target/native-gui-tests
      - name: Retain native process fixture evidence
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-boundary-${{ github.sha }}-${{ matrix.platform }}
          path: |
            target/macos-process-tests/**/*.log
            target/macos-process-tests/**/*.json
            target/macos-process-tests/**/*.jsonl
            target/process-control/**/output.*
            target/native-app-build/*.log
            target/native-app-build/*.json
            target/native-app-build/*.jsonl
            target/native-app-build/icon-assets/icon-partial.plist
            target/native-gui-tests/*.log
            target/native-gui-tests/*.json
            target/native-gui-tests/*.plist
          if-no-files-found: error
