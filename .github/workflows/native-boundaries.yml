name: Native library boundary checks
on:
  push:
    branches: [codex/v6-rust-swiftui]
permissions:
  contents: read
jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record actual compiler and machine
        run: |
          rustc -vV
          uname -a
      - name: Real owned process lifetime and signal probes
        run: |
          cargo test --locked --package xtask --bin xtask
          cargo test --locked --package xtask --test processes -- --test-threads=1
  filesystem:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record actual compiler and machine
        run: |
          rustc -vV
          uname -a
      - name: Held filesystem and namespace admission tests
        run: |
          cargo clippy --locked --package eml-fs --all-targets -- -D warnings
          cargo test --locked --package eml-fs -- --nocapture
      - name: Native core request resource admission
        run: |
          cargo clippy --locked --package eml-core --all-targets -- -D warnings
          cargo test --locked --package eml-core --test request
      - name: Real different-UID namespace controls on owned fixtures
        run: |
          cargo build --locked --package eml-fs --example namespace-credentials
          victim_uid=$(id -u)
          victim_gid=$(id -g)
          sudo -n "$PWD/target/debug/examples/namespace-credentials" "$victim_uid" "$victim_gid"
