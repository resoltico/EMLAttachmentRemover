# Release: build once, smoke the exact archives on floor hosts, attest, draft.
# Publishing the drafted GitHub release stays a manual owner action.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cli:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-cli-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: |
          for key in cargo_deny cargo_about cargo_fuzz fuzz_compiler actionlint shellcheck; do
            value=$(awk -F '"' -v key="$key" '$1 ~ "^" key " = " {print $2}' xtask/tools.toml)
            test -n "$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: cargo run --locked -p xtask --target ${{ matrix.target }} -- dist --cli --target ${{ matrix.target }} --out target/dist
      - name: Smoke the exact CLI archive
        shell: bash
        run: |
          mkdir -p target/smoke
          archive=$(find target/dist -type f | head -1)
          case "$archive" in
            *.zip) unzip "$archive" -d target/smoke ;;
            *) tar -xzf "$archive" -C target/smoke ;;
          esac
          scripts/smoke-cli.sh "$(find target/smoke -maxdepth 1 -type f -name 'emlattachmentremover*' | head -1)" tests/contract/mime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-app-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-app-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: |
          for key in cargo_deny cargo_about cargo_fuzz fuzz_compiler actionlint shellcheck; do
            value=$(awk -F '"' -v key="$key" '$1 ~ "^" key " = " {print $2}' xtask/tools.toml)
            test -n "$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo xtask dist --cli --app --universal --out target/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-universal
          path: target/dist/*
          if-no-files-found: error
  floor-smoke:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-universal
          path: target/dist
      - name: Smoke the exact CLI and app archives on the macOS 15 floor
        run: |
          mkdir -p target/smoke
          tar -xzf target/dist/emlattachmentremover-*-macos-universal.tar.gz -C target/smoke
          ditto -x -k target/dist/emlattachmentremover-gui-*-macos-universal.zip target/smoke
          scripts/smoke-cli.sh target/smoke/emlattachmentremover tests/contract/mime
          scripts/smoke-macos-app.sh "target/smoke/EML Attachment Remover.app" \
            tests/contract/mime/inputs/01-gmail-attachment.eml
  checksums:
    needs: [cli, macos, floor-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: target/dist
          merge-multiple: true
      - run: (cd target/dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checksums
          path: target/dist/SHA256SUMS
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: target/dist
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/dist/*
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --notes-from-tag target/dist/*
