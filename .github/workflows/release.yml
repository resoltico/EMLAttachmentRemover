name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONDEVMODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONWARNINGS: error
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: 3.14.8
            static: true
          - os: macos-latest
            python: 3.14.8
          - os: windows-latest
            python: 3.14.8
          - os: ubuntu-latest
            python: 3.14.8t
          - os: macos-latest
            python: 3.14.8t
          - os: windows-latest
            python: 3.14.8t
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: ${{ matrix.python }}
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - name: Validate the release tag and main ancestry
        shell: bash
        run: uv run --no-project python tools/check_release_tag.py "$RELEASE_TAG" --require-main
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
        env:
          PYTHONWARNINGS: default
      - name: Require the POSIX integration environment
        if: runner.os != 'Windows'
        shell: bash
        run: test -x /bin/sh
      - name: Install pinned Swift quality tools
        if: runner.os == 'macOS'
        run: uv run /bin/sh integrations/macos-ui/install-quality-tools.sh
      - name: Run the complete quality gate
        if: matrix.static
        run: uv run python tools/tasks.py quality
      - name: Run the platform-native quality gate
        if: ${{ !matrix.static }}
        run: uv run python tools/tasks.py quality --native
      - name: Preserve machine-readable quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-quality-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results-project-ci.xml
            build/coverage.xml
            ${{ runner.temp }}/native-fuzz-tests
          if-no-files-found: warn
          retention-days: 30

  property:
    name: Property ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONDEVMODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONWARNINGS: error
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: 3.14.8
          - os: macos-latest
            python: 3.14.8
          - os: windows-latest
            python: 3.14.8
          - os: ubuntu-latest
            python: 3.14.8t
          - os: macos-latest
            python: 3.14.8t
          - os: windows-latest
            python: 3.14.8t
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: ${{ matrix.python }}
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - name: Validate the release tag and main ancestry
        shell: bash
        run: uv run --no-project python tools/check_release_tag.py "$RELEASE_TAG" --require-main
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}
        env:
          PYTHONWARNINGS: default
      - name: Require the POSIX integration environment
        if: runner.os != 'Windows'
        shell: bash
        run: test -x /bin/sh
      - name: Install pinned Swift quality tools
        if: runner.os == 'macOS'
        run: uv run /bin/sh integrations/macos-ui/install-quality-tools.sh
      - name: Run randomized property exploration
        run: >-
          uv run python tools/tasks.py thorough
          --observable --timeout-seconds 3300
      - name: Finalize public Hypothesis evidence
        id: finalize_hypothesis
        if: always()
        run: >-
          uv run python tools/finalize_hypothesis_artifacts.py
          --observations
      - name: Preserve native fuzz regression evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-fuzz-tests-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-fuzz-tests
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve sanitized property observations
        if: always() && steps.finalize_hypothesis.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-property-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .hypothesis/observed/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  mutation:
    name: Qualify mutation results for the tagged source
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PYTHONDEVMODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONWARNINGS: error
      RELEASE_TAG: ${{ github.ref_name }}
      MUTATION_WORKERS: auto
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and canonical CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - name: Validate the release tag and main ancestry
        shell: bash
        run: uv run --no-project python tools/check_release_tag.py "$RELEASE_TAG" --require-main
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - name: Run a fresh 100% actionable mutation campaign
        run: uv run python tools/tasks.py mutation --workers "$MUTATION_WORKERS"
      - name: Preserve tagged mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutants/mutmut-cicd-stats.json
            build/mutmut-results.txt
            build/coverage.xml
            ${{ runner.temp }}/native-fuzz-tests
            build/test-results-project-ci.xml
            tools/equivalent_mutants.json
          if-no-files-found: warn
          retention-days: 30

  fuzz:
    name: Qualify native receipts with ASan and libFuzzer
    needs: qualify
    uses: ./.github/workflows/swift-fuzz.yml

  build:
    name: Build complete portable and macOS release assets
    needs:
      - qualify
      - property
      - mutation
      - fuzz
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONDEVMODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONWARNINGS: error
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and canonical CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: false
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - name: Validate the release tag and main ancestry
        shell: bash
        run: uv run --no-project python tools/check_release_tag.py "$RELEASE_TAG" --require-main
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - name: Select and verify the pinned delivery SDK
        run: uv run /bin/sh integrations/macos-ui/ci-sdk.sh >> "$GITHUB_ENV"
      - name: Install the pinned Swift toolchain
        run: uv run /bin/sh integrations/macos-ui/install-swift-toolchain.sh
      - name: Build and qualify the exact release artifact set
        # `release-dist` is ephemeral CI artifact staging, not a maintained checkout
        # distribution directory. Local `tasks.py release` continues to use an
        # external temporary directory.
        run: >-
          uv run python -B -m tools.release_delivery
          --output-directory release-dist
        env:
          TZ: UTC
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-dist/*.pyz
            release-dist/*.whl
            release-dist/*.tar.gz
            release-dist/*-macos-arm64.zip
            release-dist/*-macos-x86_64.zip
            release-dist/*-macos-arm64-external-python.zip
            release-dist/*-macos-x86_64-external-python.zip
            release-dist/SHA256SUMS
          if-no-files-found: error

  compatibility:
    name: Exercise release ZIPs on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, xcode-27]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and canonical CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - name: Download this tag's release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-dist
      - name: Reverify downloaded assets on the consumer
        run: uv run --no-project --python 3.14.8 python -B -m tools.release_delivery --verify-directory release-dist
      - name: Select Apple SDK and platform tools on minimum OS
        if: matrix.os == 'macos-14'
        run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
      - name: Install pinned Swift quality tools
        run: uv run /bin/sh integrations/macos-ui/install-quality-tools.sh
      - name: Test the tagged source and downloaded app on this OS
        run: uv run python tools/tasks.py quality --native
        env:
          EML_DELIVERY_DIRECTORY: release-dist
      - name: Preserve release compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-compatibility-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/coverage.xml
            build/test-results-project-ci.xml
            ${{ runner.temp }}/native-fuzz-tests
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Reverify, attest and publish release assets
    needs:
      - qualify
      - property
      - mutation
      - build
      - compatibility
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv and canonical CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: false
      - name: Cache and authenticate runtime source archives
        if: runner.os == 'macOS'
        uses: ./.github/actions/runtime-source
      - name: Validate the release tag and main ancestry
        shell: bash
        run: uv run --no-project python tools/check_release_tag.py "$RELEASE_TAG" --require-main
      - name: Select and verify the pinned delivery SDK
        run: uv run /bin/sh integrations/macos-ui/ci-sdk.sh >> "$GITHUB_ENV"
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-dist
      - name: Reverify the downloaded exact artifact set
        run: >-
          uv run --no-project --python 3.14.8 python
          -B -m tools.release_delivery --verify-directory release-dist
      - name: Identify the verified checksum manifest
        id: checksum-manifest
        shell: bash
        run: |
          manifest_digest=$(shasum -a 256 release-dist/SHA256SUMS)
          manifest_digest=${manifest_digest%% *}
          if [[ ! "$manifest_digest" =~ ^[0-9a-f]{64}$ ]]; then
            exit 1
          fi
          printf 'digest=sha256:%s\n' "$manifest_digest" >> "$GITHUB_OUTPUT"
      - name: Attest checksummed release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-dist/SHA256SUMS
      - name: Attest the checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: SHA256SUMS
          subject-digest: ${{ steps.checksum-manifest.outputs.digest }}
      - name: Publish and verify the changelog-bound release
        run: >-
          uv run --no-project --python 3.14.8 python -B
          -m tools.publish_release --assets-directory release-dist
        env:
          GH_TOKEN: ${{ github.token }}
