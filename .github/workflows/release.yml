# Release: build once, smoke the exact archives on floor hosts, attest, draft.
# Publishing the drafted GitHub release stays a manual owner action.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  EML_SOURCE_REVISION: ${{ github.sha }}
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cli:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: cargo xtask tool-versions >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: cargo run --locked -p xtask --target ${{ matrix.target }} -- dist --cli --target ${{ matrix.target }} --out "$RUNNER_TEMP/dist"
      - name: Smoke the exact CLI archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          archive=$(find "$RUNNER_TEMP/dist" -type f | head -1)
          case "$archive" in
            *.zip) unzip "$archive" -d "$RUNNER_TEMP/smoke" ;;
            *) tar -xzf "$archive" -C "$RUNNER_TEMP/smoke" ;;
          esac
          scripts/smoke-cli.sh "$(find "$RUNNER_TEMP/smoke" -maxdepth 1 -type f -name 'emlattachmentremover*' | head -1)" tests/contract/mime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, platform: macos-aarch64 }
          - { target: x86_64-apple-darwin, platform: macos-x86_64 }
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      ARCHIVE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-app-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: |
            cargo-app-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            cargo-app-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        run: cargo xtask tool-versions >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: rustup target add "$TARGET_TRIPLE"
      - run: cargo xtask dist --cli --app --target "$TARGET_TRIPLE" --out "$RUNNER_TEMP/dist"
      - name: Build the matching native core document probe separately from product archives
        run: |
          archive=("$RUNNER_TEMP"/dist/*-gui-*-"$ARCHIVE_PLATFORM".zip)
          unzip -p "${archive[0]}" "EML Attachment Remover.app/Contents/Info.plist" > "$RUNNER_TEMP/app-info.plist"
          MACOSX_DEPLOYMENT_TARGET=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$RUNNER_TEMP/app-info.plist")
          export MACOSX_DEPLOYMENT_TARGET
          cargo build --locked --profile dist --target "$TARGET_TRIPLE" -p eml-gui --bin eml-gui-document-probe --features desktop
          cargo_artifacts=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          cp "$cargo_artifacts/$TARGET_TRIPLE/dist/eml-gui-document-probe" "$RUNNER_TEMP/eml-gui-document-probe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-document-probe-${{ matrix.target }}
          path: ${{ runner.temp }}/eml-gui-document-probe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-dist-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
  floor-smoke:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64, arch: arm64 }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x86_64, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCHIVE_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-dist-${{ matrix.target }}
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-document-probe-${{ matrix.target }}
          path: ${{ runner.temp }}/document-probe
      - name: Smoke the matching CLI and app archives on the macOS 15 floor
        run: |
          chmod +x "$RUNNER_TEMP/document-probe/eml-gui-document-probe"
          mkdir -p target/smoke
          tar -xzf target/dist/emlattachmentremover-*-"$ARCHIVE_PLATFORM".tar.gz -C target/smoke
          ditto -x -k target/dist/emlattachmentremover-gui-*-"$ARCHIVE_PLATFORM".zip target/smoke
          host_arch=$(uname -m)
          [[ "$host_arch" == "$EXPECTED_ARCH" ]]
          translated=$(sysctl -in sysctl.proc_translated)
          [[ "$translated" != "1" ]]
          cli_arch=$(lipo -archs target/smoke/emlattachmentremover)
          [[ "$cli_arch" == "$EXPECTED_ARCH" ]]
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "target/smoke/EML Attachment Remover.app/Contents/Info.plist")
          cli_version=$(target/smoke/emlattachmentremover --version)
          [[ "$cli_version" == "emlattachmentremover $app_version ($EML_SOURCE_REVISION)" ]]
          scripts/smoke-cli.sh target/smoke/emlattachmentremover tests/contract/mime
          scripts/smoke-macos-app.sh "target/smoke/EML Attachment Remover.app" \
            tests/contract/mime/inputs/01-gmail-attachment.eml "$RUNNER_TEMP/document-probe/eml-gui-document-probe" "$EXPECTED_ARCH"
  checksums:
    needs: [cli, macos, floor-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-dist-aarch64-apple-darwin
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-dist-x86_64-apple-darwin
          path: target/dist
      - name: Hash the complete release archive set
        run: |
          (
            cd target/dist
            archives=( *.tar.gz *.zip )
            # Six CLI archives (Linux/Windows/macOS, both CPUs) and two Mac apps.
            [[ "${#archives[@]}" -eq 8 ]] || { echo "Expected eight release archives" >&2; exit 1; }
            cp "$GITHUB_WORKSPACE/install/install.sh" "$GITHUB_WORKSPACE/install/install.ps1" .
            sha256sum -- "${archives[@]}" install.sh install.ps1 > SHA256SUMS
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-files
          path: |
            target/dist/SHA256SUMS
            target/dist/install.sh
            target/dist/install.ps1
          if-no-files-found: error
  install:
    name: Qualify installer (${{ matrix.runner }})
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-26.04, artifact: cli-x86_64-unknown-linux-gnu }
          - { runner: ubuntu-26.04-arm, artifact: cli-aarch64-unknown-linux-gnu }
          - { runner: windows-2022, artifact: cli-x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, artifact: cli-aarch64-pc-windows-msvc }
          - { runner: macos-15, artifact: macos-dist-aarch64-apple-darwin }
          - { runner: macos-15-intel, artifact: macos-dist-x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.artifact }}
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer-files
          path: release
      - name: Shells for startup-file checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install, update and uninstall the exact Unix release
        if: runner.os != 'Windows'
        run: bash install/install_test.sh "$PWD/release"
      - name: Install, update and uninstall the exact Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install/install_test.ps1 -Dist "$PWD/release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the tagged version's changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git show HEAD:CHANGELOG.md | awk -v version="${TAG#v}" '
            BEGIN { heading = "## [" version "]" }
            /^##([[:space:]]|$)/ {
              inside = ($0 == heading || index($0, heading " ") == 1)
              if (inside) {
                matches++
                date = substr($0, length(heading) + 1)
                if (date !~ /^ - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) invalid = 1
              }
              next
            }
            inside {
              notes = notes $0 "\n"
              if ($0 ~ /[^[:space:]]/) content = 1
            }
            END {
              if (matches != 1 || invalid || !content) {
                print "Expected one nonempty dated CHANGELOG.md entry for " version > "/dev/stderr"
                exit 1
              }
              printf "%s", notes
            }
          ' > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-dist-aarch64-apple-darwin
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-dist-x86_64-apple-darwin
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer-files
          path: target/dist
      - name: Verify the downloaded release archives before attesting
        run: (cd target/dist && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/dist/*
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" target/dist/*
