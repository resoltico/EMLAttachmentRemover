name: Owner release
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact full commit on main to qualify and release
        required: true
        type: string
      version:
        description: Workspace version with a nonempty dated changelog section
        required: true
        type: string
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: owner-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  admission:
    permissions:
      contents: write # Draft visibility requires push access; admission does not mutate releases.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Admit exact source and owner dispatch from main
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Admit source from current main before executing repository code
        env:
          SOURCE: ${{ inputs.source }}
        run: &admit_source |
          head=$(git rev-parse HEAD)
          test "$head" = "$SOURCE"
          local_main=$(git rev-parse refs/remotes/origin/main)
          remote_main=$(git ls-remote --exit-code origin refs/heads/main)
          test "$remote_main" = "$(printf '%s\trefs/heads/main' "$local_main")"
          git merge-base --is-ancestor "$SOURCE" "$local_main"
          source_workflows=$(git rev-parse "${SOURCE}:.github/workflows")
          main_workflows=$(git rev-parse "${local_main}:.github/workflows")
          test "$source_workflows" = "$main_workflows"
      - name: Read-only release admission
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p target
          cargo xtask release-check --source "$SOURCE" --version "$VERSION" > target/release-admission.json
          test "$(jq -er .release.state target/release-admission.json)" = absent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && hashFiles('target/release-admission.json') != '' }}
        with:
          name: release-admission-${{ inputs.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            target/release-admission.json
            target/release-check/**
            target/release-inputs/verified-inputs.json
          if-no-files-found: error
  qualification:
    permissions:
      contents: read
      actions: read
    needs: admission
    uses: ./.github/workflows/native-qualification.yml
    with:
      source: ${{ inputs.source }}
  publish:
    needs: [admission, qualification]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ inputs.source }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck source against current main before executing repository code
        run: *admit_source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-products-${{ inputs.source }}-*-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: target/qualified-products
          merge-multiple: false
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: floor-smoke-${{ inputs.source }}-*-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: target/desktop-qualification
          merge-multiple: false
          digest-mismatch: error
      - name: Resolve the exact picker artifact directory from the admitted plan
        env:
          PICKER_MATRIX: ${{ needs.qualification.outputs.picker }}
        run: |
          platform=$(jq -er '.include | select(type == "array" and length == 1) | .[0].platform | select(type == "string" and length > 0)' <<< "$PICKER_MATRIX")
          [[ "$platform" =~ ^[a-z0-9_-]+$ ]]
          printf 'PICKER_ARTIFACT=picker-qualification-%s-%s-r%s-a%s\n' "$SOURCE" "$platform" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.PICKER_ARTIFACT }}
          path: target/picker-qualification/${{ env.PICKER_ARTIFACT }}
          digest-mismatch: error
      - name: Freeze the exact qualified product set and qualification identity
        env:
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          cargo xtask release-check --source "$SOURCE" --version "$VERSION" > target/release-admission.json
          cargo xtask distribution > target/release-distribution.json
          cargo xtask verify-release-inputs --products target/qualified-products --desktop target/desktop-qualification --picker target/picker-qualification --out target/release-inputs > target/release-inputs.json
          cargo xtask stage-release-assets --inputs target/release-inputs/verified-inputs.json --out target/release-assembly > target/release-assembly.json
          assets="$(jq -er .assets_directory target/release-assembly.json)"
          printf 'RELEASE_ASSETS=%s\n' "$assets" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > target/release-native-jobs.json
          jq -n --arg source "$SOURCE" --arg dispatch "$DISPATCH_SHA" --arg workflow "$WORKFLOW_REF" --arg workflow_sha "$WORKFLOW_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --slurpfile policy target/release-distribution.json --slurpfile assembly target/release-assembly.json --slurpfile inputs target/release-inputs/verified-inputs.json \
            '{source:$source,dispatch_sha:$dispatch,workflow_ref:$workflow,workflow_sha:$workflow_sha,qualification_run:$run,policy:$policy[0],assembly:$assembly[0],verified_inputs:$inputs[0],scope:"native candidate production, frozen shipping desktop/picker and producer-frozen controlled-companion qualification, and exact eight-product shipping asset assembly; dispatch workflow identity and artifact source are distinct"}' > target/release-predicate.json
          awk -v version="$VERSION" 'index($0,"## [" version "] - ")==1 {selected=1; next} selected && /^## / {exit} selected {print}' CHANGELOG.md > target/release-notes.md
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2; explicit qualification/source predicate
        with:
          subject-path: ${{ env.RELEASE_ASSETS }}/*
          predicate-type: https://github.com/resoltico/EMLAttachmentRemover/attestations/native-qualification/v1
          predicate-path: target/release-predicate.json
          create-storage-record: false
      - name: Create draft, verify actual server assets, then publish
        run: |
          tag="v$VERSION"
          cargo xtask release-check --source "$SOURCE" --version "$VERSION" > target/release-admission-before-upload.json
          test "$(jq -er .release.state target/release-admission-before-upload.json)" = absent
          gh release create "$tag" --draft --target "$SOURCE" --title "$tag" --notes-file target/release-notes.md
          gh release upload "$tag" "$RELEASE_ASSETS"/*
          gh release view "$tag" --json databaseId > target/release-draft-lookup.json
          release_id=$(jq -er '.databaseId|select(type=="number" and .>0 and floor==.)' target/release-draft-lookup.json)
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > target/release-server-before-publish.json
          jq -e --argjson id "$release_id" '.id==$id' target/release-server-before-publish.json
          cargo xtask check-release-server --inputs target/release-inputs/verified-inputs.json --assets "$RELEASE_ASSETS" --release target/release-server-before-publish.json > target/release-server-checked.json
          gh release edit "$tag" --draft=false --latest
      - name: Observe server state after success or failure without deleting anything
        if: ${{ always() }}
        run: |
          mkdir -p target
          gh release view "v$VERSION" --json databaseId > target/release-final-lookup.json 2> target/release-final-lookup-error.txt
          release_id=$(jq -er '.databaseId|select(type=="number" and .>0 and floor==.)' target/release-final-lookup.json)
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          gh api --include "repos/$GITHUB_REPOSITORY/releases/$release_id" > target/release-server-final-response.txt 2> target/release-server-final-error.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: release-observations-${{ inputs.source }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            target/release-*.json
            target/release-*.jsonl
            target/release-*.txt
            target/release-*.md
            target/release-check/**
            target/release-inputs/verified-inputs.json
          if-no-files-found: error
