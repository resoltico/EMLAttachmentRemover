# Release: build once, smoke the exact archives on floor hosts, attest, draft.
# Publishing the drafted GitHub release stays a manual owner action.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  EML_SOURCE_REVISION: ${{ github.sha }}
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cli:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: cargo xtask tool-versions >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: cargo run --locked -p xtask --target ${{ matrix.target }} -- dist --cli --target ${{ matrix.target }} --out "$RUNNER_TEMP/dist"
      - name: Smoke the exact CLI archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          archive=$(find "$RUNNER_TEMP/dist" -type f | head -1)
          case "$archive" in
            *.zip) unzip "$archive" -d "$RUNNER_TEMP/smoke" ;;
            *) tar -xzf "$archive" -C "$RUNNER_TEMP/smoke" ;;
          esac
          scripts/smoke-cli.sh "$(find "$RUNNER_TEMP/smoke" -maxdepth 1 -type f -name 'emlattachmentremover*' | head -1)" tests/contract/mime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-app-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'xtask/tools.toml') }}
          restore-keys: cargo-app-${{ runner.os }}-${{ runner.arch }}-
      - name: Read tool versions
        id: tools
        shell: bash
        run: cargo xtask tool-versions >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-about@${{ steps.tools.outputs.cargo_about }}
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo xtask dist --cli --app --universal --out "$RUNNER_TEMP/dist"
      - name: Build the native core document probe separately from product archives
        run: |
          archive=("$RUNNER_TEMP"/dist/*-gui-*-macos-universal.zip)
          unzip -p "${archive[0]}" "EML Attachment Remover.app/Contents/Info.plist" > "$RUNNER_TEMP/app-info.plist"
          MACOSX_DEPLOYMENT_TARGET=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$RUNNER_TEMP/app-info.plist")
          export MACOSX_DEPLOYMENT_TARGET
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --profile dist --target "$target" -p eml-gui --bin eml-gui-document-probe --features desktop
          done
          cargo_artifacts=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          lipo -create "$cargo_artifacts/aarch64-apple-darwin/dist/eml-gui-document-probe" "$cargo_artifacts/x86_64-apple-darwin/dist/eml-gui-document-probe" -output "$RUNNER_TEMP/eml-gui-document-probe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-document-probe
          path: ${{ runner.temp }}/eml-gui-document-probe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-universal
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
  floor-smoke:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-universal
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-document-probe
          path: ${{ runner.temp }}/document-probe
      - name: Smoke the exact CLI and app archives on the macOS 15 floor
        run: |
          chmod +x "$RUNNER_TEMP/document-probe/eml-gui-document-probe"
          mkdir -p target/smoke
          tar -xzf target/dist/emlattachmentremover-*-macos-universal.tar.gz -C target/smoke
          ditto -x -k target/dist/emlattachmentremover-gui-*-macos-universal.zip target/smoke
          scripts/smoke-cli.sh target/smoke/emlattachmentremover tests/contract/mime
          scripts/smoke-macos-app.sh "target/smoke/EML Attachment Remover.app" \
            tests/contract/mime/inputs/01-gmail-attachment.eml "$RUNNER_TEMP/document-probe/eml-gui-document-probe"
  checksums:
    needs: [cli, macos, floor-smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-universal
          path: target/dist
      - run: (cd target/dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checksums
          path: target/dist/SHA256SUMS
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checksums]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the tagged version's changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git show HEAD:CHANGELOG.md | awk -v version="${TAG#v}" '
            BEGIN { heading = "## [" version "]" }
            /^##([[:space:]]|$)/ {
              inside = ($0 == heading || index($0, heading " ") == 1)
              if (inside) {
                matches++
                date = substr($0, length(heading) + 1)
                if (date !~ /^ - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) invalid = 1
              }
              next
            }
            inside {
              notes = notes $0 "\n"
              if ($0 ~ /[^[:space:]]/) content = 1
            }
            END {
              if (matches != 1 || invalid || !content) {
                print "Expected one nonempty dated CHANGELOG.md entry for " version > "/dev/stderr"
                exit 1
              }
              printf "%s", notes
            }
          ' > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: cli-*
          path: target/dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-universal
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: checksums
          path: target/dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/dist/*
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" target/dist/*
