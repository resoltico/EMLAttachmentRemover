name: Owned macOS startup observation
on:
  push:
    branches: [codex/v6-rust-swiftui]
    paths:
      - .github/workflows/macos-startup-diagnostic.yml
      - xtask/src/**
      - xtask/tool-locks/**
      - xtask/tools.toml
      - xtask/distribution.toml
      - macos-app/**
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: plan
        run: |
          plan=$(cargo xtask distribution)
          matrix=$(jq -ce '{include: [.native_targets[] | select(.os == "macos" and .architecture == "x86_64") | {platform,target,runner}]} | select(.include | length == 1)' <<< "$plan")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  observe:
    name: Direct startup / ${{ matrix.platform }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and actual host
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          compiler=$(rustc -vV)
          printf '%s\n' "$compiler"
          host=$(awk '/^host: / {print $2}' <<< "$compiler")
          test "$host" = "$EXPECTED_TARGET"
          uname -a
          sw_vers
          printf 'ImageOS=%s ImageVersion=%s\n' "$ImageOS" "$ImageVersion"
      - name: Build and audit private pinned tools
        run: cargo xtask tools
      - name: Finite owned signed app child; no Finder or GUI qualification
        run: cargo xtask macos-startup-diagnostic --out target/app-startup-observation
      - name: Retain actual startup and build observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direct-startup-${{ github.sha }}-${{ matrix.platform }}
          path: |
            target/app-startup-observation/**/*.json
            target/app-startup-observation/**/*.jsonl
            target/app-startup-observation/**/*.log
            target/app-startup-observation/**/*.stderr
            target/repository-tools/build-*/*.json
            target/repository-tools/build-*/*.jsonl
            target/repository-tools/build-*/*.log
            target/process-control/**/output.*
          if-no-files-found: error
