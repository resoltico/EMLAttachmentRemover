name: Native Windows filesystem feasibility
on:
  push:
    branches: [codex/v6-rust-swiftui]
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive Windows filesystem evidence matrix
        id: targets
        run: |
          plan=$(cargo xtask distribution)
          matrix=$(jq -ce '{include: [.native_targets[] | select(.os == "windows") | {platform,target,runner}]} | select(.include | length == 2)' <<< "$plan")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  windows:
    needs: distribution
    name: NTFS / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-feasibility
      EML_WINDOWS_EVIDENCE_DIR: ${{ github.workspace }}/target/windows-creation-evidence
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.distribution.outputs.matrix) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native GNU LLVM host
        id: native_toolchain
        run: |
          rustup toolchain install 1.99.0-${{ matrix.target }} --profile minimal --component rust-mingw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sysroot = rustc +1.99.0-${{ matrix.target }} --print sysroot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $linker = Join-Path $sysroot 'lib/rustlib/${{ matrix.target }}/bin/rust-lld.exe'
          if (!(Test-Path $linker)) { throw 'Missing selected sysroot rust-lld' }
          'CARGO_TARGET_${{ matrix.target }}_LINKER'.ToUpper().Replace('-', '_') + '=' + $linker >> $env:GITHUB_ENV
      - name: Prepare owned filesystem scratch
        id: filesystem_scratch
        run: |
          $scratch = Join-Path $env:GITHUB_WORKSPACE 'target/native-feasibility/scratch'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          'TEMP=' + $scratch >> $env:GITHUB_ENV
          'TMP=' + $scratch >> $env:GITHUB_ENV
      - name: Required Windows test discovery and native workspace execution
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $arguments = @('test', '--workspace', '--locked', '--features', 'eml-core/native-fixtures', '--target', '${{ matrix.target }}')
          $listing = & cargo +1.99.0-${{ matrix.target }} @arguments -- --list --color never 2>&1
          $listingExit = $LASTEXITCODE
          $listing | ForEach-Object { Write-Output $_ }
          if ($listingExit -ne 0) { exit $listingExit }
          $listing | Set-Content -Encoding utf8 target/native-feasibility/tests.list
          $ignored = & cargo +1.99.0-${{ matrix.target }} @arguments -- --list --ignored --color never 2>&1
          $ignoredExit = $LASTEXITCODE
          $ignored | ForEach-Object { Write-Output $_ }
          if ($ignoredExit -ne 0) { exit $ignoredExit }
          $ignored | Set-Content -Encoding utf8 target/native-feasibility/tests-ignored.list
          & ./tests/windows/assert-test-sentinels.ps1 -Listing target/native-feasibility/tests.list -IgnoredListing target/native-feasibility/tests-ignored.list
          & cargo +1.99.0-${{ matrix.target }} @arguments -- --color never
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
      - name: Native distribution planner
        run: |
          cargo +1.99.0-${{ matrix.target }} run --locked --package xtask --bin xtask --target ${{ matrix.target }} -- distribution
          exit $LASTEXITCODE
      - name: Standalone native filesystem primitive
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc +1.99.0-${{ matrix.target }} -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0-${{ matrix.target }} run --locked --manifest-path tests/native-filesystem/Cargo.toml --target ${{ matrix.target }}
          exit $LASTEXITCODE
      - name: One-off native rejection-control experiments
        run: |
          $clone = Join-Path $env:GITHUB_WORKSPACE 'target/windows-rejection-source'
          git clone --no-hardlinks --no-checkout $env:GITHUB_WORKSPACE $clone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $clone checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'target/windows-rejection-build'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'target/windows-rejection-controls'
          Push-Location $clone
          try {
            & (Join-Path $env:GITHUB_WORKSPACE 'tests/windows/run-rejection-controls.ps1') -Target '${{ matrix.target }}' -Evidence $evidence
          } finally { Pop-Location }
      - name: Retain native Windows boundary observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-boundary-${{ github.sha }}-${{ matrix.target }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            target/windows-creation-evidence/*.json
            target/native-feasibility/*.list
            target/windows-rejection-controls/**
          if-no-files-found: error
