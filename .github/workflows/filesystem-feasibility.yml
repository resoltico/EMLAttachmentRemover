name: Native Windows filesystem feasibility
on:
  push:
    branches: [codex/v6-rust-swiftui]
permissions:
  contents: read
jobs:
  windows:
    name: NTFS / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnullvm
            runner: windows-2022
          - target: aarch64-pc-windows-gnullvm
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native GNU LLVM host
        run: |
          rustup toolchain install 1.99.0-${{ matrix.target }} --profile minimal --component rust-mingw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sysroot = rustc +1.99.0-${{ matrix.target }} --print sysroot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $linker = Join-Path $sysroot 'lib/rustlib/${{ matrix.target }}/bin/rust-lld.exe'
          if (!(Test-Path $linker)) { throw 'Missing selected sysroot rust-lld' }
          'CARGO_TARGET_${{ matrix.target }}_LINKER'.ToUpper().Replace('-', '_') + '=' + $linker >> $env:GITHUB_ENV
      - name: Native core request resource admission
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-feasibility
        run: |
          rustc +1.99.0-${{ matrix.target }} -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $requestOutput = cargo +1.99.0-${{ matrix.target }} test --locked --package eml-core --test request --target ${{ matrix.target }} -- --color never 2>&1
          $requestExit = $LASTEXITCODE
          $requestOutput | ForEach-Object { Write-Output $_ }
          if ($requestExit -ne 0) { exit $requestExit }
          if (@($requestOutput | Where-Object { $_.ToString() -match '^running [1-9][0-9]* tests?$' }).Count -ne 1) { throw 'Expected nonempty native request tests' }
          if (@($requestOutput | Where-Object { $_.ToString() -match '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' }).Count -ne 1) { throw 'Request tests require nonzero passes and zero failures, ignores or filters' }
      - name: Record native host and run actual filesystem operations
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-feasibility
        run: |
          rustc +1.99.0-${{ matrix.target }} -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = Join-Path $env:GITHUB_WORKSPACE 'target/native-feasibility/scratch'
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $env:TMP = $env:TEMP
          cargo +1.99.0-${{ matrix.target }} run --locked --manifest-path tests/native-filesystem/Cargo.toml --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeName = 'windows::test_reparse::tests::attribute_only_writer_must_not_convert_strictly_pinned_directory'
          $testListing = cargo +1.99.0-${{ matrix.target }} test --locked --package eml-fs --lib --target ${{ matrix.target }} -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($testListing | Where-Object { $_ -eq ($probeName + ': test') }).Count -ne 1) { throw 'Expected exactly one discovered attribute-only safety test' }
          $probeOutput = cargo +1.99.0-${{ matrix.target }} test --locked --package eml-fs --lib --target ${{ matrix.target }} -- --exact $probeName --nocapture --color never 2>&1
          $probeExit = $LASTEXITCODE
          $probeOutput | ForEach-Object { Write-Output $_ }
          if ($probeExit -ne 0) { exit $probeExit }
          if (@($probeOutput | Where-Object { $_.ToString().Trim() -eq 'running 1 test' }).Count -ne 1) { throw 'Expected exactly one executed attribute-only safety test' }
          if (@($probeOutput | Where-Object { $_.ToString() -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;' }).Count -ne 1) { throw 'Attribute-only safety test did not pass with zero ignored cases' }
          cargo +1.99.0-${{ matrix.target }} test --locked --package eml-core --lib naming --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.0-${{ matrix.target }} test --locked --package eml-fs --lib --target ${{ matrix.target }} -- --skip $probeName --nocapture
          exit $LASTEXITCODE
