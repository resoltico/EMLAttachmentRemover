name: Focused POSIX mutation investigation
on:
  push:
    branches:
      - fix/mutation-qualification-posix-regressions
    paths:
      - .github/workflows/posix-mutation-investigation.yml

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDEVMODE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTHONWARNINGS: error
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and CPython
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
          python-version: 3.14.8
          enable-cache: auto
          cache-dependency-glob: uv.lock
      - name: Install locked development dependencies
        run: uv sync --locked --group dev --python 3.14.8
        env:
          PYTHONWARNINGS: default
      - name: Exercise selected mutants within the production isolation envelope
        shell: bash
        run: |
          set -euo pipefail
          # This investigation workflow is branch-only: exclude its temporary
          # steps from the repository's authoritative workflow-parity audit.
          # The workflow itself is removed from the eventual PR.
          rm .github/workflows/posix-mutation-investigation.yml
          uv run python -B - <<'PY'
          from dataclasses import replace

          from tools import mutation_task, tasks

          selected = (
              "eml_attachment_remover.cli_parser.x__consumed_option_values__mutmut_19",
              "eml_attachment_remover.cli_parser.x__consumed_option_values__mutmut_29",
              "eml_attachment_remover.native_posix.x__close_bound_directory__mutmut_16",
              "eml_attachment_remover.native_posix.x__close_bound_directory__mutmut_17",
              "eml_attachment_remover.native_posix.x__discard_private_stage__mutmut_2",
              "eml_attachment_remover.native_posix.x__inspect_source_identity__mutmut_2",
              "eml_attachment_remover.native_posix.x__publish_stage_no_replace__mutmut_3",
              "eml_attachment_remover.native_posix_acl.x_restrict__mutmut_29",
              "eml_attachment_remover.native_posix_acl.x_restrict__mutmut_31",
              "eml_attachment_remover.native_posix_acl.x_restrict__mutmut_58",
              "eml_attachment_remover.native_posix_acl.x_restrict__mutmut_64",
              "eml_attachment_remover.native_posix_acl.x_restrict__mutmut_76",
              "eml_attachment_remover.native_posix_acl.x_restrict__mutmut_77",
              "eml_attachment_remover.native_posix_acl.x_restrict__mutmut_78",
              "eml_attachment_remover.native_posix_stage.x__creation_cleanup__mutmut_10",
              "eml_attachment_remover.native_posix_stage.x__creation_cleanup__mutmut_11",
              "eml_attachment_remover.native_posix_stage.x__creation_cleanup__mutmut_2",
              "eml_attachment_remover.native_posix_stage.x__creation_cleanup__mutmut_3",
              "eml_attachment_remover.native_posix_stage.x__require_private_directory__mutmut_12",
              "eml_attachment_remover.native_posix_stage.x__require_private_directory__mutmut_8",
              "eml_attachment_remover.native_posix_stage.x__same_directory__mutmut_4",
              "eml_attachment_remover.native_posix_stage.x_create__mutmut_17",
              "eml_attachment_remover.native_posix_stage.x_create__mutmut_20",
              "eml_attachment_remover.native_posix_stage.x_create__mutmut_59",
              "eml_attachment_remover.native_posix_stage.x_create__mutmut_6",
              "eml_attachment_remover.native_posix_stage.x_discard__mutmut_21",
              "eml_attachment_remover.native_posix_stage.x_discard__mutmut_7",
              "eml_attachment_remover.native_posix_stage.x_publish__mutmut_14",
              "eml_attachment_remover.native_posix_stage.x_publish__mutmut_30",
              "eml_attachment_remover.native_posix_stage.x_publish__mutmut_7",
          )
          canonical = mutation_task.run_mutation

          def focused(paths, actions, executable, **kwargs):
              original_run = actions.run

              def run(command, **options):
                  if tuple(command[:2]) == ("mutmut", "run"):
                      command = (*command, *selected)
                  return original_run(command, **options)

              return canonical(
                  paths,
                  replace(actions, run=run, diagnose=lambda: None),
                  executable,
                  **kwargs,
              )

          mutation_task.run_mutation = focused
          try:
              # An investigative partial run is never allowed to qualify the
              # full mutation gate or bypass its final statistics validator.
              tasks._mutation(workers=3, preflight=False)
          except ExceptionGroup as error:
              failures = error.exceptions
              if (
                  len(failures) != 1
                  or "validate statistics failed:" not in str(failures[0])
              ):
                  raise
              print("Expected incomplete global score from intentionally focused probe")
          PY
      - name: Preserve selected statuses and bounded source patches
        shell: bash
        run: |
          set -euo pipefail
          uv run python -B - <<'PY'
          import subprocess
          from pathlib import Path

          from tools import mutation_diagnostics

          prefixes = (
              "eml_attachment_remover.native_posix.",
              "eml_attachment_remover.native_posix_acl.",
              "eml_attachment_remover.native_posix_stage.",
          )
          exact = {
              "eml_attachment_remover.cli_parser.x__consumed_option_values__mutmut_19",
              "eml_attachment_remover.cli_parser.x__consumed_option_values__mutmut_29",
          }
          source = Path("build/mutmut-results.txt")
          selected = sorted(
              line
              for line in source.read_text(encoding="utf-8").splitlines()
              if (line.rpartition(": ")[0].startswith(prefixes)
                  or line.rpartition(": ")[0] in exact)
              and not line.endswith(": killed")
          )
          output = Path("build/selected-not-killed.txt")
          output.write_text("".join(line + "\n" for line in selected), encoding="utf-8")

          def show(mutant: str) -> str:
              return subprocess.check_output(
                  ("uv", "run", "mutmut", "show", mutant),
                  text=True,
                  timeout=60,
              )

          mutation_diagnostics.collect(
              output,
              Path("mutants/mutmut-stats.json"),
              Path("build/selected-diagnostics"),
              show,
          )
          print(f"Selected non-killed mutants: {len(selected)}")
          print("\n".join(selected))
          PY
      - name: Upload focused source-bound findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posix-survivor-investigation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/selected-not-killed.txt
            build/selected-diagnostics/
            build/mutmut-results.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: error
          retention-days: 7
