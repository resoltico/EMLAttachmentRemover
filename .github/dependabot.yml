version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    groups:
      slint:
        patterns:
          - slint
          - slint-build
          - i-slint-core
          - i-slint-backend-testing
