# Applies to normal, build, dev, fuzz and repository-tool dependency graphs.
[advisories]
unmaintained = "all"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "RustSec reports chrono as unmaintained. Published Slint 1.19.0 requires it. Remove this exception when chrono leaves the dependency graph." },
]

# Repository/tool approval is distinct from the shipped target notice closure.
# BSL-1.0 is already accepted for shipped binaries in legal/about.toml.
[licenses]
allow = ["AGPL-3.0-only", "GPL-3.0-only", "MPL-2.0", "MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "ISC", "Zlib", "Apache-2.0 WITH LLVM-exception", "BSL-1.0"]
exceptions = [
  { crate = "arrayref@0.3.9", allow = ["BSD-2-Clause"] },
  { crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
