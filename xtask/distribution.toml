# Expected distribution policy, not a record of completed native qualification.
[policy]
macos_minimum = "15.0"
linux_minimum_ubuntu = "22.04"
linux_glibc_maximum = "2.35"
windows_rust_minimum = "10"

# Intel GUI qualification uses the affected hosted image with recorded preparation.
# https://github.com/actions/runner-images/issues/14751
[picker_host]
image_os = "macos26"
image_version = "20260824.0517.1"
product_version = "26.6.1"
build_version = "25G76"

[[targets]]
platform = "macos-aarch64"
target = "aarch64-apple-darwin"
runner = "macos-26"
app_smoke_runner = "macos-15"

[[targets]]
platform = "macos-x86_64"
target = "x86_64-apple-darwin"
runner = "macos-26-intel"
app_smoke_runner = "macos-15-intel"

[[targets]]
platform = "linux-x86_64"
target = "x86_64-unknown-linux-gnu"
runner = "ubuntu-22.04"

[[targets]]
platform = "linux-aarch64"
target = "aarch64-unknown-linux-gnu"
runner = "ubuntu-22.04-arm"

[[targets]]
platform = "windows-x86_64"
target = "x86_64-pc-windows-gnullvm"
runner = "windows-2022"

[[targets]]
platform = "windows-aarch64"
target = "aarch64-pc-windows-gnullvm"
runner = "windows-11-arm"
