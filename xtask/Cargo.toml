[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
ctrlc.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
eml-fs = { path = "../crates/eml-fs" }
eml-core = { path = "../crates/eml-core" }
eml-protocol = { path = "../crates/eml-protocol" }
toml = "1.1.8"
tempfile.workspace = true
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
eml-windows = { path = "../crates/eml-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
eml-app = { path = "../crates/eml-app" }
eml-macos = { path = "../crates/eml-macos", features = ["native-fixtures"] }

[lints]
workspace = true

[[bin]]
name = "process-probe"
path = "tests/support/process_probe.rs"
test = false

[[bin]]
name = "archive-counterfeit"
path = "tests/support/archive_counterfeit.rs"
test = false
